name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nonogram-web
        uses: actions/checkout@v4
        with:
          path: nonogram-web

      - name: Checkout nonogram-app (backend)
        uses: actions/checkout@v4
        with:
          repository: chanaRoobinski/nonogram-app
          path: nonogram-app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install backend
        working-directory: nonogram-app
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Start backend
        working-directory: nonogram-app
        run: |
          nohup uvicorn nonogram.api.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/openapi.json > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not become ready in time"; cat uvicorn.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nonogram-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: nonogram-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: nonogram-web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: nonogram-web
        run: npm run e2e
        env:
          VITE_API_BASE_URL: http://localhost:8000
